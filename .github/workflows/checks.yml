name: Validate standalone app
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review_test_only
          POSTGRES_DB: review
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U review"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify_data.py
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://review:review_test_only@localhost:5432/review
