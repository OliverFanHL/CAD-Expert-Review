[project]
name = "cad-expert-review"
version = "1.0.0"
description = "Independent source-bound CAD expert review workflow"
requires-python = ">=3.12,<3.13"
dependencies = ["Flask==3.1.2", "numpy==2.3.4", "psycopg[binary]==3.2.12"]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
